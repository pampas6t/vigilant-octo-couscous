<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Simple Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f5f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: radial-gradient(ellipse at top, #252b3e 0%, #10131c 65%);
    }

    .calculator {
      width: min(100%, 360px);
      padding: 1.25rem;
      border: 1px solid #343b50;
      border-radius: 1.5rem;
      background: #191e2b;
      box-shadow: 0 24px 70px #0008;
    }

    h1 {
      margin: 0 0 1rem;
      color: #aeb8d2;
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
    }

    .display {
      min-height: 6rem;
      display: flex;
      align-items: end;
      justify-content: end;
      overflow: hidden;
      margin-bottom: 1rem;
      padding: 1rem;
      border-radius: 1rem;
      background: #10141f;
      color: #fff;
      font-size: clamp(2rem, 12vw, 3rem);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .65rem;
    }

    button {
      min-height: 3.75rem;
      border: 0;
      border-radius: .9rem;
      background: #292f40;
      color: #f5f7ff;
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background .15s, transform .08s;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #383f54; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #9aabff; outline-offset: 2px; }
    button.utility { background: #3a4155; color: #c9d1e8; }
    button.operator { background: #343c59; color: #b7c4ff; }
    button.equals { background: #788cff; color: #10131c; font-weight: 700; }
    button.equals:hover { background: #91a1ff; }
    button.span-two { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <output class="display" id="display" aria-live="polite" aria-label="Display">0</output>
    <div class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="backspace" aria-label="Delete last digit">⌫</button>
      <button class="operator" data-operator="÷" aria-label="Divide">÷</button>
      <button class="operator" data-operator="×" aria-label="Multiply">×</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="−" aria-label="Subtract">−</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="+" aria-label="Add">+</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>

      <button class="span-two" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button data-action="sign" aria-label="Change sign">±</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    let current = "0";
    let stored = null;
    let operation = null;
    let replaceCurrent = false;

    function render() {
      display.textContent = current;
    }

    function enterDigit(digit) {
      if (replaceCurrent || current === "Error") {
        current = digit;
        replaceCurrent = false;
      } else {
        current = current === "0" ? digit : current + digit;
      }
      render();
    }

    function enterDecimal() {
      if (replaceCurrent || current === "Error") {
        current = "0.";
        replaceCurrent = false;
      } else if (!current.includes(".")) {
        current += ".";
      }
      render();
    }

    function calculate(a, b, operator) {
      switch (operator) {
        case "+": return a + b;
        case "−": return a - b;
        case "×": return a * b;
        case "÷": return b === 0 ? NaN : a / b;
        default: return b;
      }
    }

    function format(value) {
      if (!Number.isFinite(value)) return "Error";
      return String(Number(value.toPrecision(10)));
    }

    function chooseOperator(nextOperation) {
      const value = Number(current);
      if (operation && !replaceCurrent) {
        const result = calculate(stored, value, operation);
        current = format(result);
        render();
        if (current === "Error") {
          stored = null;
          operation = null;
          replaceCurrent = true;
          return;
        }
        stored = Number(current);
      } else {
        stored = value;
      }
      operation = nextOperation;
      replaceCurrent = true;
    }

    function equals() {
      if (!operation || stored === null || current === "Error") return;
      current = format(calculate(stored, Number(current), operation));
      stored = null;
      operation = null;
      replaceCurrent = true;
      render();
    }

    function handleAction(action) {
      switch (action) {
        case "clear":
          current = "0";
          stored = null;
          operation = null;
          replaceCurrent = false;
          break;
        case "backspace":
          if (replaceCurrent || current === "Error") {
            current = "0";
            replaceCurrent = false;
          } else {
            current = current.length > 1 ? current.slice(0, -1) : "0";
            if (current === "-") current = "0";
          }
          break;
        case "decimal": enterDecimal(); return;
        case "sign":
          if (current !== "0" && current !== "Error") current = String(-Number(current));
          break;
        case "equals": equals(); return;
      }
      render();
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      else if (button.dataset.operator) chooseOperator(button.dataset.operator);
      else if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") enterDecimal();
      else if (event.key === "+") chooseOperator("+");
      else if (event.key === "-") chooseOperator("−");
      else if (event.key === "*" || event.key.toLowerCase() === "x") chooseOperator("×");
      else if (event.key === "/") { event.preventDefault(); chooseOperator("÷"); }
      else if (event.key === "Enter" || event.key === "=") { event.preventDefault(); equals(); }
      else if (event.key === "Backspace") handleAction("backspace");
      else if (event.key === "Escape") handleAction("clear");
    });
  </script>
</body>
</html>
